name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (uv)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync

      - name: Build search pipeline (data/prwp)
        run: uv run python search/pipeline/pipeline.py prwp --compress=none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: search/pnpm-lock.yaml

      - name: Install search dependencies
        working-directory: search
        run: pnpm install

      - name: Build search library (index.js + search.worker.js)
        working-directory: search
        run: pnpm build:lib

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload entire repo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the whole repo root so all existing paths keep working.
          # search/dist/ (built above) is included automatically.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
